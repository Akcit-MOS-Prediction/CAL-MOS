title: CAL-MOS-${model.model_name}-(epochs-${trainer.max_epochs})-(bs-${train.batch_size})-(LR-${optimizer.params.learning_rate})
debug: false

tags:
  - wav2vec2
  - brspeech
  - grid_search
model:
    model_type: "dynamic"
    model_name: "facebook/wav2vec2-base"
    mlp_input_dim: 1536
    use_layer_norm: true
    layer_norm_eps: 1e-5
    layer_norm_affine: false
    mlp_hidden_dim: ${model.mlp_input_dim}
    mlp_num_layers: 1
    mlp_output_size: ${data.num_classes}
    mlp_dropout: 0.1
    mlp_activation_func: "relu"
    layer_weight_strategy: "per_layer"
    num_feature_layers: -1 # Must be adapted to the model (-1 is the last layer)
    specific_layer_idx: -1
    last_layer: true
    pooling_strategy: "attpool"
    freeze_backbone: true
    transformer_hidden_size: ${model.mlp_input_dim}
    transformer_nhead: 4
    transformer_dim_feedforward: 2048
    transformer_activation: "gelu"
    transformer_dropout: 0.1
    transformer_layer_norm_eps: 1e-5
    transformer_bias: true
    transformer_num_hidden_layers: 2

optimizer:
    name: "adamw"
    params:
        min_learning_rate: 1e-5
        learning_rate: 5e-5
        eps: 1e-8
        weight_decay: 1e-6
        betas: [0.9, 0.98]

scheduler:
    name: "CosineWarmupLR"
    params:
        warmup_steps: 500

trainer:
    accelerator: "gpu"
    max_epochs: 1
    num_sanity_val_steps: 2
    overfit_batches: 0.0
    log_every_n_steps: 10
    gradient_clip_val: 10.0
    gradient_clip_algorithm: "norm"
    val_check_interval: 1.0
    accumulate_grad_batches: 2

model_checkpoint:
    mode: "max"
    save_last: false
    save_top_k: 1
    save_weights_only: true
    monitor: "val/spearman"
    dirpath: "../checkpoints/mos-prediction"
    filename: "{epoch:02d}-{step:02d}-{val/spearman:.4f}"


early_stopping:
    monitor: "val/spearman"
    patience: 25
    check_on_train_epoch_end: false
    mode: "max"
    min_delta: 0.0
    verbose: true

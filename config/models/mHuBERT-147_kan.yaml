title: KAN-${model.model_name}-(epochs-${trainer.max_epochs})-(bs-${train.batch_size})-(LR-${optimizer.params.learning_rate})

model:
    model_type: "dynamic_kan"                   # ← KAN

    # model_name: "microsoft/wavlm-large"
    # model_name: "facebook/wav2vec2-base"
    # model_name: "facebook/wav2vec2-large"
    # model_name: "facebook/wav2vec2-xls-r-300m"
    # model_name: "facebook/wav2vec2-xls-r-1b"
    # model_name: facebook/mms-300m
    # model_name: facebook/mms-1b
    # model_name: "facebook/hubert-large-ls960-ft"
    # model_name: "openai/whisper-large"
    model_name: "utter-project/mHuBERT-147"

    mlp_input_dim: 768                          # mHuBERT-147 hidden size
    mlp_hidden_dim: ${model.mlp_input_dim}
    mlp_num_layers: 1
    mlp_output_size: ${data.num_classes}
    mlp_dropout: 0.1                            # ← KAN usa 0.3
    mlp_activation_func: "relu"
    layer_weight_strategy: "per_layer"
    num_feature_layers: -1
    specific_layer_idx: -1
    pooling_strategy: "mean"
    relukan_k: 3                                # ← KAN
    relukan_grid: 5                             # ← KAN

    freeze_backbone: true

    # PEFT parameters
    use_peft: false
    lora_keys: ["key"]
    lora_r: 2
    lora_alpha: 2
    lora_dropout: 0.1
    bias: "none"

    # MelSpec encoder
    ced_embedding_dim: 192                      # tiny
    # ced_embedding_dim: 256                    # mini
    # ced_embedding_dim: 384                    # small
    # ced_embedding_dim: 768                    # base
    ced_proj_size: 512
    ced_proj_dropout: 0.5
    ced_pretrained: true
    ced_freeze: false

optimizer:
    name: "adamw"
    params:
        min_learning_rate: 1e-7                 # ← KAN usa LR maior
        learning_rate: 5e-4                     # ← KAN usa LR maior
        eps: 1e-8
        weight_decay: 1e-6
        betas: [0.9, 0.98]

scheduler:
    name: "CosineWarmupLR"
    params:
        warmup_lr: 1e-6
        warmup_steps: 500

tags:
    - ${train.batch_size}-BS
    - LR-${optimizer.params.learning_rate}
    - WD-${optimizer.params.weight_decay}
    - ${model.model_name}-HS
    - ${model.mlp_input_dim}-AH
    - ${model.mlp_hidden_dim}-HL
    - ${model.mlp_num_layers}-IS

trainer:
    accelerator: "gpu"
    max_epochs: 100
    num_sanity_val_steps: 2
    overfit_batches: 0.0
    log_every_n_steps: 10
    gradient_clip_val: 10.0
    gradient_clip_algorithm: "norm"
    val_check_interval: 1.0
    accumulate_grad_batches: 4                  # ← KAN usa 8 (era 16)

model_checkpoint:
    mode: "max"
    save_last: true
    save_weights_only: true
    monitor: "val/spearman"
    dirpath: "../checkpoints/mos-prediction"
    filename: "{epoch:02d}-{step:02d}-{val/spearman:.4f}"

early_stopping:
    monitor: "val/spearman"
    patience: 20
    mode: "max"
    min_delta: 0.001
    verbose: true
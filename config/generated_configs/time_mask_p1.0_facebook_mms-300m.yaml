title: CAL-MOS-${model.model_name}-(augmentation-${augmentation.name})-(pct-${augmentation.probability})
wandb_entity: proga150-ufrn
datasets:
  train:
  - name: Train
    metadata_path: /home/lustosa/SingMOS/sets/train_mos_list.csv
    base_dir: /home/lustosa/SingMOS/wav
    filename_column: file_path
    target_column: mos
  val:
  - name: Validation
    metadata_path: /home/lustosa/SingMOS/sets/val_mos_list.csv
    base_dir: /home/lustosa/SingMOS/wav
    filename_column: file_path
    target_column: mos
  test:
  - name: Test
    metadata_path: /home/lustosa/SingMOS/sets/eval_mos_list.csv
    base_dir: /home/lustosa/SingMOS/wav
    filename_column: file_path
    target_column: mos
data:
  use_seqaug: false
  num_classes: 1
  target_sr: 16000
  mixup_alpha: 0.0
  use_rand_truncation: false
  min_duration: 2.0
  min_white_noise_amp: 0.01
  max_white_noise_amp: 0.1
  insert_white_noise: false
augmentation:
  name: time_mask
  probability: 1.0
  params:
    min_band_part: 0.01
    max_band_part: 0.2
    mask_location: random
train:
  batch_size: 2
  shuffle: true
  num_workers: 12
model:
  model_type: augmentation
  model_name: facebook/mms-300m
  mlp_input_dim: 1024
  mlp_hidden_dim: 1024
  mlp_num_layers: 1
  mlp_output_size: ${data.num_classes}
  mlp_dropout: 0.1
  mlp_activation_func: relu
  layer_weight_strategy: per_layer
  num_feature_layers: 25
  specific_layer_idx: -1
  pooling_strategy: mean
  freeze_backbone: false
  transformer_hidden_size: 1024
  transformer_nhead: 4
  transformer_dim_feedforward: 2048
  transformer_activation: gelu
  transformer_dropout: 0.1
  transformer_layer_norm_eps: 1.0e-05
  transformer_bias: true
  transformer_num_hidden_layers: 2
optimizer:
  name: adamw
  params:
    min_learning_rate: 1.0e-05
    learning_rate: 5.0e-05
    eps: 1.0e-08
    weight_decay: 1.0e-06
    betas:
    - 0.9
    - 0.98
scheduler:
  name: CosineWarmupLR
  params:
    warmup_lr: 500
tags:
- ${train.batch_size}-BS
- LR-${optimizer.params.learning_rate}
- WD-${optimizer.params.weight_decay}
- ${model.model_name}-HS
- ${model.mlp_input_dim}-AH
- ${model.mlp_hidden_dim}-HL
- ${model.mlp_num_layers}-IS
trainer:
  accelerator: gpu
  max_epochs: 20
  num_sanity_val_steps: 2
  overfit_batches: 0.0
  log_every_n_steps: 10
  gradient_clip_val: 10.0
  gradient_clip_algorithm: norm
  val_check_interval: 1.0
  accumulate_grad_batches: 8
model_checkpoint:
  mode: max
  save_last: true
  save_weights_only: true
  monitor: val/spearman
  dirpath: ../checkpoints/mos-prediction
  filename: '{epoch:02d}-{step:02d}-{val/spearman:.4f}'

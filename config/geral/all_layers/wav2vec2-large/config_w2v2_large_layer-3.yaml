title: Voicemos-CAL-MOS-OneLayerEmbedding-wav2vec-large-(epochs-${trainer.max_epochs})-(bs-${train.batch_size})-(LR-${optimizer.params.learning_rate})-layer-3
wandb_entity: snaxofc10-utfpr-medianeira
datasets:
  train:
  - name: Train
    metadata_path: F:/Git/CAL-MOS/data/voice_mos/track3_obf/DATA/combined_train.csv
    base_dir: F:/Git/CAL-MOS/data/voice_mos/track3_obf/wav2vec_large/wav2vec_large_layer-3
    filename_column: uttID
    target_column: rating
  val:
  - name: Validation
    metadata_path: F:/Git/CAL-MOS/data/voice_mos/track3_obf/DATA/combined_val.csv
    base_dir: F:/Git/CAL-MOS/data/voice_mos/track3_obf/wav2vec_large/wav2vec_large_layer-3
    filename_column: uttID
    target_column: rating
  test:
  - name: Test
    metadata_path: F:/Git/CAL-MOS/data/voice_mos/track3_obf/DATA/combined_test.csv
    base_dir: F:/Git/CAL-MOS/data/voice_mos/track3_obf/wav2vec_large/wav2vec_large_layer-3
    filename_column: uttID
    target_column: rating
data:
  use_seqaug: false
  num_classes: 1
train:
  batch_size: 64
  shuffle: true
  num_workers: 12
model:
  model_type: one_layer_embedding
  mlp_input_dim: 1024
  mlp_hidden_dim: ${model.mlp_input_dim}
  mlp_num_layers: 1
  mlp_output_size: ${data.num_classes}
  mlp_dropout: 0.1
  mlp_activation_func: relu
  pooling_strategy: mean
optimizer:
  name: adamw
  params:
    min_learning_rate: 1e-5
    learning_rate: 5e-5
    eps: 1e-8
    weight_decay: 1e-6
    betas:
    - 0.9
    - 0.98
scheduler:
  name: CosineWarmupLR
  params:
    warmup_lr: 500
tags:
- ${train.batch_size}-BS
- LR-${optimizer.params.learning_rate}
- WD-${optimizer.params.weight_decay}
- ${model.mlp_input_dim}-AH
- ${model.mlp_hidden_dim}-HL
- ${model.mlp_num_layers}-IS
trainer:
  accelerator: gpu
  max_epochs: 100
  num_sanity_val_steps: 2
  overfit_batches: 0.0
  log_every_n_steps: 10
  gradient_clip_val: 10.0
  gradient_clip_algorithm: norm
  val_check_interval: 1.0
  accumulate_grad_batches: 1
model_checkpoint:
  mode: max
  save_last: true
  save_weights_only: true
  monitor: val/spearman
  dirpath: ../checkpoints/mos-prediction
  filename: '{epoch:02d}-{step:02d}-{val/spearman:.4f}'

title: Clova-mms-CAL-MOS-OneLayerEmbedding-MMS300M-(epochs-${trainer.max_epochs})-(bs-${train.batch_size})-(LR-${optimizer.params.learning_rate})

wandb_entity: snaxofc10-utfpr-medianeira

datasets:
    train:
        - name: Train
          metadata_path: "../data/BRSPEECH_MOS_DATASET_v2/train_mos.csv"
          base_dir: "../data/BRSPEECH_MOS_DATASET_v2_concat"
        #   base_dir: "../data/BRSPEECH_MOS_DATASET_v2_mms_embedding_titanet"
          filename_column: "filepath"
          target_column: "mos"

    val:
        - name: Validation
          metadata_path: "../data/BRSPEECH_MOS_DATASET_v2/val_mos.csv"
          base_dir: "../data/embeddings_concat_clova_mms2"
        #   base_dir: "../data/BRSPEECH_MOS_DATASET_v2_mms_embedding_titanet"
          filename_column: "filepath"
          target_column: "mos"

data:
    use_seqaug: false
    num_classes: 1

train:
    batch_size: 64
    shuffle: True
    num_workers: 0 #0

model:
    model_type: "one_layer_embedding"

    mlp_input_dim: 1024 # Must be adapted to the model
    mlp_hidden_dim: ${model.mlp_input_dim} # Must be adapted to the model, should be the same as mlp_input_dim
    mlp_num_layers: 1
    mlp_output_size: ${data.num_classes}
    mlp_dropout: 0.1
    mlp_activation_func: "relu"
    pooling_strategy: "mean" # Take the mean of the sequence in the last layer

optimizer:
    name: "adamw"
    params:
        min_learning_rate: 1e-5 # Same used in https://ecs.utdallas.edu/research/researchlabs/msp-lab/publications/Goncalves_2024.pdf
        learning_rate: 5e-5 # Same used in https://ecs.utdallas.edu/research/researchlabs/msp-lab/publications/Goncalves_2024.pdf
        eps: 1e-8
        weight_decay: 1e-6
        betas: [0.9, 0.98]

scheduler:
    name: "CosineWarmupLR"
    params:
        warmup_lr: 500

tags:
    - ${train.batch_size}-BS
    - LR-${optimizer.params.learning_rate}
    - WD-${optimizer.params.weight_decay}
    - ${model.mlp_input_dim}-AH
    - ${model.mlp_hidden_dim}-HL
    - ${model.mlp_num_layers}-IS

trainer:
    accelerator: "gpu"
    max_epochs: 20
    num_sanity_val_steps: 2
    overfit_batches: 0.0
    log_every_n_steps: 10
    gradient_clip_val: 10.0
    gradient_clip_algorithm: "norm"
    val_check_interval: 1.0 # Every 1 epoch
    accumulate_grad_batches: 1

model_checkpoint:
    mode: "max"
    save_last: true
    save_weights_only: true
    monitor: "val/spearman"
    dirpath: "../checkpoints/mos-prediction"
    filename: "{epoch:02d}-{step:02d}-{val/spearman:.4f}"